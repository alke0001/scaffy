name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: cp .env.test .env
      - run: pnpm run ci
      # Same checks as `pnpm run verify` (separate steps for granular CI logs — ADR-010)
      - run: pnpm run lint
      - run: pnpm run check
      - run: pnpm run check:i18n
      - run: pnpm run test:run
