name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: cp .env.test .env
      - run: pnpm run ci
      # Same checks as `pnpm run verify` (separate steps for granular CI logs — ADR-010)
      - run: pnpm run lint
      - run: pnpm run check
      - run: pnpm run check:i18n
      # ADR-024: full production scan → sbom.json → allowlist check (scripts/allowed-licenses.json)
      - run: pnpm run licenses:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-sbom
          path: sbom.json
          if-no-files-found: ignore
      - run: pnpm run test:run
